[build]
  publish = "."
  functions = "."

# Vast adres voor de QR-code op de bladwijzer. Dit adres verandert nooit,
# de bestemming mag later wel aangepast worden.
[[redirects]]
  from = "/doe-mee"
  to = "/?bron=bladwijzer#meedoen"
  status = 302

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/bevestigd"
  to = "/bevestigd.html"
  status = 200

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
