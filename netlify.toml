[build]
  publish = "."
  functions = "."

# Extra domeinen
# hetgoede.be -> hetgoede.org
[[redirects]]
  from = "https://hetgoede.be/*"
  to = "https://hetgoede.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.hetgoede.be/*"
  to = "https://hetgoede.org/:splat"
  status = 301
  force = true

# le-bien.org toont de Franse pagina; www en lebien.be sturen door
[[redirects]]
  from = "https://www.le-bien.org/*"
  to = "https://le-bien.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://lebien.be/*"
  to = "https://le-bien.org/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.lebien.be/*"
  to = "https://le-bien.org/"
  status = 301
  force = true

[[redirects]]
  from = "https://le-bien.org/"
  to = "/fr.html"
  status = 200
  force = true

[[redirects]]
  from = "https://le-bien.org/confidentialite"
  to = "/confidentialite.html"
  status = 200
  force = true

# the-good.org stuurt voorlopig door naar hetgoede.org
[[redirects]]
  from = "https://the-good.org/*"
  to = "https://hetgoede.org/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.the-good.org/*"
  to = "https://hetgoede.org/"
  status = 301
  force = true

# Interne bestanden niet publiek tonen
[[redirects]]
  from = "/DEPLOY.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/inschrijven.js"
  to = "/404"
  status = 404
  force = true

# Vast adres voor de QR-code op de bladwijzer. Dit adres verandert nooit,
# de bestemming mag later wel aangepast worden.
[[redirects]]
  from = "/doe-mee"
  to = "/?bron=bladwijzer#meedoen"
  status = 302

# Pagina's
[[redirects]]
  from = "/fr"
  to = "/fr.html"
  status = 200

[[redirects]]
  from = "/fr/"
  to = "/fr.html"
  status = 200

[[redirects]]
  from = "/fr/confidentialite"
  to = "/confidentialite.html"
  status = 200

[[redirects]]
  from = "/26november"
  to = "/26november.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/confidentialite"
  to = "/confidentialite.html"
  status = 200

[[redirects]]
  from = "/bevestigd"
  to = "/bevestigd.html"
  status = 200

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
