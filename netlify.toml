[build]
  publish = "."
  functions = "."

# Oude en extra domeinen sturen door naar hetgoede.org
[[redirects]]
  from = "https://hetgoede.be/*"
  to = "https://hetgoede.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.hetgoede.be/*"
  to = "https://hetgoede.org/:splat"
  status = 301
  force = true

# Interne bestanden niet publiek tonen
[[redirects]]
  from = "/DEPLOY.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/inschrijven.js"
  to = "/404"
  status = 404
  force = true

# Vast adres voor de QR-code op de bladwijzer. Dit adres verandert nooit,
# de bestemming mag later wel aangepast worden.
[[redirects]]
  from = "/doe-mee"
  to = "/?bron=bladwijzer#meedoen"
  status = 302

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/bevestigd"
  to = "/bevestigd.html"
  status = 200

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
