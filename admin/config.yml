# Teksten beheren voor hetgoede.org en le-bien.org
# Aanmelden via DecapBridge (site Het goede, aangemaakt op 22 oktober 2026).
backend:
  name: git-gateway
  repo: Het-Goede/hetgoede.org
  branch: main
  identity_url: https://auth.decapbridge.com/sites/eed98c32-b51e-4bc2-bd94-6a1beb2d903e
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    update: Tekst aangepast via CMS - {{author-name}}

logo_url: https://hetgoede.org/cover.webp
site_url: https://hetgoede.org
display_url: https://hetgoede.org
locale: "nl"
media_folder: "cms/beeld"
public_folder: "/cms/beeld"

collections:
  - name: "teksten"
    label: "Teksten"
    delete: false
    editor:
      preview: false
    files:
      - name: "nl"
        label: "Nederlands · hetgoede.org"
        file: "cms/nl.json"
        description: "Alle teksten van hetgoede.org. Opslaan zet de wijziging binnen een minuut online."
        fields:
          - { label: "Browsertitel", name: "titel", widget: "string", hint: "Titel in het tabblad en in Google" }
          - { label: "Beschrijving voor Google", name: "beschrijving", widget: "text" }
          - { label: "Titel bij delen (LinkedIn, WhatsApp)", name: "og_titel", widget: "string" }
          - { label: "Beschrijving bij delen", name: "og_beschrijving", widget: "text" }
          - { label: "Knop bovenaan", name: "bestel_top", widget: "string" }
          - { label: "Grote titel", name: "hoofdtitel", widget: "string" }
          - { label: "Ondertitel onder de grote titel", name: "ondertitel", widget: "text", hint: "Een nieuwe regel geeft een regeleinde" }
          - { label: "Samenleving · titel", name: "s_titel", widget: "string" }
          - { label: "Samenleving · alinea 1", name: "s_p1", widget: "text" }
