<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Bevestigd — Het Goede</title>
<style>
  @font-face{font-family:"Avenir";src:url(/avenir-regular.woff2) format("woff2");font-weight:400}
  @font-face{font-family:"Avenir";src:url(/avenir-heavy.woff2) format("woff2");font-weight:700 800}
  html,body{background:#fff}
  body{margin:0;color:#46443E;font-family:"Avenir","Avenir Next",-apple-system,"Segoe UI",sans-serif;
       font-size:17px;line-height:1.8;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:72px 26px 96px}
  h1{color:#15130F;font-weight:800;font-size:36px;line-height:1.15;letter-spacing:-.02em;margin:0 0 18px}
  h2{color:#15130F;font-weight:800;font-size:20px;margin:40px 0 10px}
  p,li{margin:0 0 14px}
  a{color:#15130F}
  .terug{display:inline-block;margin-top:40px;font-size:15px}
  .concept{background:#F4F1EC;padding:14px 18px;font-size:14px;margin-bottom:32px}
</style>
</head>
<body><div class="wrap">
<h1 id="kop">Je inschrijving is bevestigd</h1>
<p id="tekst">Dank je. We houden je op de hoogte van Het Goede, en je hoort het als eerste wanneer de vereniging vorm krijgt.</p>
<a class="terug" id="terug" href="/">Terug naar Het Goede</a>
<script>
var q = new URLSearchParams(location.search), fr = q.get('taal') === 'fr', lanc = q.get('soort') === 'lancering';
if (lanc) {
  document.getElementById('kop').textContent = 'Tot 26 november';
  document.getElementById('tekst').textContent = 'Je inschrijving voor de lancering is bevestigd. De dag voordien sturen we je een herinnering.';
  document.getElementById('terug').href = '/26november';
  document.getElementById('terug').textContent = 'Terug naar de lancering';
} else if (fr) {
  document.documentElement.lang = 'fr';
  document.title = 'Confirmé — Le Bien';
  document.getElementById('kop').textContent = 'Votre inscription est confirmée';
  document.getElementById('tekst').textContent = 'Merci. Nous vous tiendrons au courant du Bien, et vous serez parmi les premiers informés lorsque l’association prendra forme.';
  document.getElementById('terug').href = '/fr/';
  document.getElementById('terug').textContent = 'Retour au Bien';
}
</script>
</div><script src="/meta.js" defer></script>
</body></html>
